name: multi_image_crop
description: A flutter package to crop multiple images at a time on iOS and Android.
version: 0.0.3
homepage:
publish_to: 'none'

environment:
  sdk: ">=2.17.2 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  preload_page_view: 0.2.0
  scroll_to_index: 3.0.1
  image_crop:
     path: ../image_crop
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

